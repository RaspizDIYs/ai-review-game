server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache-Control задаётся ровно один раз на локацию: директива expires
    # добавляет свой заголовок поверх add_header, и получаются два разных
    # Cache-Control в одном ответе — что делать с таким, браузер решает сам.

    # Файлы сборки содержат хэш в имени, поэтому кэшируются навсегда.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Музыка и портреты имени не меняют, но и содержимого тоже: качать
    # шестнадцать мегабайт на каждый заход незачем.
    location ~* ^/(music|agents)/ {
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # index.html — никогда: иначе новая выкладка доедет до игрока через сутки,
    # а дневной челлендж он увидит вчерашний.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
