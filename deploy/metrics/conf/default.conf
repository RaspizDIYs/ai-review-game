# Приёмник метрик. Всё «приложение» — это формат лога и 204 в ответ.
#
# IP в лог не пишется намеренно: события не должны склеиваться в сессию.
# Из-за этого же нет ни кук, ни идентификатора игрока — в аналитике так нельзя
# посчитать «уникальных пользователей», и это осознанная плата.

log_format events escape=json '$time_iso8601 $args';

server {
    listen 80;
    server_name _;

    # Единственная ручка. Картинка приходит GET-запросом, значит CORS не нужен.
    location = /e {
        access_log /var/log/nginx/events.log events;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # Агрегат для игры: сколько людей нашло каждую подлянку.
    # CORS нужен, потому что игра живёт на другом домене (GitHub Pages),
    # а это уже не пиксель, а fetch. Данные обезличенные и публичные,
    # поэтому origin не ограничиваем.
    location = /stats.json {
        root /srv/stats;
        access_log off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        default_type application/json;
    }

    # Проверка живости, в лог событий не попадает.
    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        access_log off;
        return 404;
    }
}
